<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Progress Bar</title>
    <style>
        #progress-bar {
            width: 100%;
            height: 30px;
            border: 1px solid #ccc;
            position: relative;
            margin-top: 20px;
        }

        #progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            color: #333;
        }

        .progress-section {
            height: 100%;
            background-color: #3498db;
            position: absolute;
            transition: width 0.5s ease-in-out;
        }
    </style>
</head>
<body>

  <div id="progress-text">0%</div>
    <div id="progress-bar">
        <!-- Dynamically create progress sections using JavaScript -->
    </div>

    <script>
        // Function to dynamically create progress sections
        function createProgressSections(totalSections) {
            const progressBar = document.getElementById('progress-bar');

            for (let i = 0; i < totalSections; i++) {
                const section = document.createElement('div');
                section.className = 'progress-section';
                section.style.width = `${100 / totalSections}%`; // Set initial width

                progressBar.appendChild(section);
            }
        }

        // Call the function with the desired number of sections (e.g., 10)
        createProgressSections(10);

        // Function to update progress every second
        function updateProgress() {
            const sections = document.querySelectorAll('.progress-section');
            const progressText = document.getElementById('progress-text');

            let percentage = 0;

            setInterval(() => {
                percentage += 10;
                if (percentage > 100) {
                    percentage = 0;
                }

                sections.forEach((section, index) => {
                    section.style.width = `${percentage / sections.length * (index + 1)}%`;
                });

                progressText.textContent = `${percentage}%`;
            }, 1000);
        }

        // Start updating progress
        updateProgress();
    </script>

</body>
</html>
