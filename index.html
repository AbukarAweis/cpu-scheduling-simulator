<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header><h1>CPU Scheduling Simulator</h1></header>

    <div class="container">

        <div class="left-div">
            <div id="process-table" style="overflow-y:scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Process ID</th>
                            <th>Arrival Time</th>
                            <th>Burst Time</th>
                        </tr>
                    </thead>
                    <tbody>
        
                    </tbody>
                    <table>
                        
                    </table>
                </table>
            </div>

            <div id="input">
                <input type="number" min="0" id="process-id" placeholder="Process ID" pattern="[0-9]+"
                        style="width: 80px; padding: 4px; box-sizing: border-box; font-size: 11px;">
                <input type="number" min="0" id="arrival-time" placeholder="Arrival Time" pattern="[0-9]+"
                        style="width: 85px; padding: 4px; box-sizing: border-box; font-size: 11px;">
                <input type="number" min="0" id="burst-time" placeholder="Burst Time" pattern="[0-9]+"
                        style="width: 85px; padding: 6px; box-sizing: border-box; font-size: 11px;">
                <button type="button" onclick="addProcess()">Add Process</button>
            </div>

            <div id="algo-div">
                <label for="algorithm">Select Scheduling Algorithm: </label>
                <select id="algo-select">
                    <option value="fcfs">First-Come, First-Served</option>
                    <option value="sjf">Shortest Job First</option>
                    <option value="rr">Round Robin</option>
                </select>
                <button type="button" onclick="startTimer()">Start Simulation</button>
            </div>

        </div>

        <div class="center-div">
            <!-- <div id="queue-div">
                <p>Waiting Queue</p>
                <div id="waiting-queue">
                    
                </div>
                
                <p>Finished Queue</p>
                <div id="finished-queue">
                    
                </div>
            </div>
            

            <div id="cpu">
                <p>cpu</p>
            </div>

            <div id="timer">

            </div> -->
            <div id="simulation">
                <div id="queues">
                    <p id="text">Waiting</p>
                    <div id="waiting-queue">

                    </div>
                    <p id="text">Finished</p>
                    <div id="finished-queue">

                    </div>
                </div>

                <div id="control">
                    <p id="text">CPU</p>
                    <div id="cpu">
                        
                    </div>
    
                    <p id="text">Status</p>
                    <div id="status">
                        <p id="time">Time: ---</p>
                        <p id="completed">Completed: ---</p>
                    </div>
                </div>
            </div>

            <div id="simulation-summary">
                <table>
                    <thead>
                        <tr>
                            <th>Process ID</th>
                            <th>Arrival Time</th>
                            <th>Burst Time</th>
                            <th>Completed Time</th>
                            <th>Waiting Time</th>
                            <th>Turnaroud Time</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>

        <div class="right-div">
            
        </div>

    </div>
   

</body>
</html>
