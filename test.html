<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Validation with Tooltip</title>
    <style>
        /* Optional: Add some styling */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .tooltip {
            display: none;
            position: absolute;
            background-color: #f44336;
            color: #fff;
            padding: 5px;
            border-radius: 5px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <label for="myInput">Enter a valid value:</label>
    <input type="text" id="myInput">
    <button onclick="validateInput()">Submit</button>

    <!-- Tooltip element -->
    <div class="tooltip" id="errorTooltip"></div>

    <script src="script.js"></script>
</body>
</html>
