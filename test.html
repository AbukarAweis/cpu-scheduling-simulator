<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Divs on Top of Each Other</title>
    <style>
        /* Optional: Add some styling */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .div {
            width: 200px;
            height: 100px;
            background-color: lightblue;
            margin: 10px; /* Optional: Add margin for spacing */
        }

        .div1 {
            /* Default positioning: stacked on top of each other */
        }

        .div2 {
            position: relative;
            top: -100px; /* Adjust the top value to control the overlap */
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <div class="div div1">Div 1</div>
    <div class="div div2">Div 2</div>
</body>
</html>
