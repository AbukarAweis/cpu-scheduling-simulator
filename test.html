<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Selector</title>
    <style>
        /* Optional: Reset some default styles */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }

        /* Stylish Checklist Styles */
        .checklist {
            list-style: none;
            padding: 0;
        }

        .checklist-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .checklist-item input {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <ul class="checklist">
        <li class="checklist-item">
            <input type="checkbox" id="item1" name="item1">
            <label for="item1">Item 1</label>
        </li>
        <li class="checklist-item">
            <input type="checkbox" id="item2" name="item2">
            <label for="item2">Item 2</label>
        </li>
        <li class="checklist-item">
            <input type="checkbox" id="item3" name="item3">
            <label for="item3">Item 3</label>
        </li>
    </ul>
</body>
</html>
