<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrinking Animation</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .shrink-div {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            animation: shrinkAnimation 2s ease-in-out infinite alternate;
        }

        @keyframes shrinkAnimation {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(0.5);
            }
        }
    </style>
</head>
<body>
    <div class="shrink-div"></div>
</body>
</html>
